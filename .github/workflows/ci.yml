name: CI

# Corre en CUALQUIER rama, no solo en main y develop.
#
# Antes solo se disparaba al abrir la peticion de incorporacion, asi que para
# saber si un cambio rompia algo habia que compilar y probar en local: cinco
# minutos por intento, y el contenedor volvia a descargar las dependencias cada
# vez. Con esto, cada push devuelve el resultado de todas las pruebas sin ocupar
# la maquina de nadie, y el error aparece en el commit que lo causo en lugar de
# aparecer todo junto al final.
on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    name: Compilar y probar
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compilar
        run: mvn -B clean compile

      - name: Ejecutar pruebas
        run: mvn -B test
