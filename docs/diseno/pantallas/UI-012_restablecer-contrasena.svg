<svg viewBox="0 0 1280 800" width="1280" height="800" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d"><title id="t">UI-012 Restablecer contrasena</title><desc id="d">Formulario con codigo, contrasena nueva y confirmacion, con el ultimo campo enfocado y una franja verde confirmando el envio del codigo.</desc><rect x="0" y="0" width="1280" height="800" rx="0" fill="#0B0E14"/><rect x="0" y="0" width="520" height="800" rx="0" fill="#12171F"/><rect x="64" y="72" width="34" height="34" rx="4" fill="#0D9488"/><text x="81" y="96" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="700" fill="#0B0E14" text-anchor="middle">F</text><text x="110" y="98" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="700" fill="#E6E8EC" text-anchor="start">FinMind</text><text x="64" y="340" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="34" font-weight="700" fill="#E6E8EC" text-anchor="start">Nueva</text><text x="64" y="384" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="34" font-weight="700" fill="#E6E8EC" text-anchor="start">contrasena.</text><text x="64" y="426" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="400" fill="#9BA3AF" text-anchor="start">Ingresa el codigo que te llego</text><text x="64" y="450" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="400" fill="#9BA3AF" text-anchor="start">y elige una contrasena nueva.</text><rect x="640" y="90" width="520" height="620" rx="12" fill="#151A23" stroke="#1E2530" stroke-width="1"/><text x="680" y="146" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="700" fill="#E6E8EC" text-anchor="start">Restablecer contrasena</text><text x="680" y="174" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="400" fill="#7C8493" text-anchor="start">Codigo enviado a kevin@ejemplo.com</text><rect x="680" y="19