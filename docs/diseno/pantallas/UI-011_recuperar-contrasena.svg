<svg viewBox="0 0 1280 800" width="1280" height="800" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d"><title id="t">UI-011 Recuperar contrasena</title><desc id="d">Formulario de un solo campo de correo con boton de envio y nota sobre la respuesta uniforme que evita revelar que cuentas existen.</desc><rect x="0" y="0" width="1280" height="800" rx="0" fill="#0B0E14"/><rect x="0" y="0" width="520" height="800" rx="0" fill="#12171F"/><rect x="64" y="72" width="34" height="34" rx="4" fill="#0D9488"/><text x="81" y="96" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="700" fill="#0B0E14" text-anchor="middle">F</text><text x="110" y="98" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="700" fill="#E6E8EC" text-anchor="start">FinMind</text><text x="64" y="340" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="34" font-weight="700" fill="#E6E8EC" text-anchor="start">Te ayudamos</text><text x="64" y="384" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="34" font-weight="700" fill="#E6E8EC" text-anchor="start">a volver.</text><text x="64" y="426" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="400" fill="#9BA3AF" text-anchor="start">Te enviamos un codigo para crear</text><text x="64" y="450" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="400" fill="#9BA3AF" text-anchor="start">una contrasena nueva.</text><rect x="660" y="210" width="460" height="380" rx="12" fill="#151A23" stroke="#1E2530" stroke-width="1"/><text x="700" y="266" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="700" fill="#E6E8EC" text-anchor="start">Recuperar contrasena</text><text x="700" y="294" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="400" fill="#7C8493" text-anchor="start">Escribe tu correo y te enviaremos</text><text x="700" y="316" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="400" fill="#7C8493" text-anchor="start">un codigo para crear una nueva.</text><text x="700" y="360" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#9BA3AF" text-anchor="start">Correo electronico</text><rect x="700" y="370" width="380" height="40" rx="8" fill="#151A23" stroke="#252C38" stroke-width="1"/><text x="712" y="395" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="400" fill="#7C8493" text-anchor="start">kevin@ejemplo.com</text><rect x="700" y="442" width="380" height="44" rx="8" fill="#14B8A6"/><text x="890.0" y="469.0" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="600" fill="#151A23" text-anchor="middle">Enviar codigo</text><rect x="700" y="504" width="380" height="56" rx="8" fill="#0F2E27" stroke="#14B8A6" stroke-width="1"/><rect x="700" y="504" width="4" height="56" rx="0" fill="#14B8A6"/><text x="718" y="528" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#14B8A6" text-anchor="start">La respuesta es siempre la misma</text><text x="718" y="546" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#9BA3AF" text-anchor="start">RN-014: no revelamos si el correo esta registrado.</text><text x="1260" y="786" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#7C8493" text-anchor="end">MK-011 / UI-011  v1.0  FinMind  2026-09-08</text></svg>