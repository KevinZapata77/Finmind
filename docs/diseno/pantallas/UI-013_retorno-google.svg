<svg viewBox="0 0 1280 800" width="1280" height="800" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d"><title id="t">UI-013 Retorno de Google</title><desc id="d">Pantalla de espera que aparece al volver de Google mientras se abre la sesion. El usuario no interactua con ella.</desc><rect x="0" y="0" width="1280" height="800" rx="0" fill="#F7F8FA"/><rect x="390" y="250" width="500" height="300" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/><rect x="615" y="300" width="50" height="50" rx="25" fill="#DCF2EC"/><text x="640" y="334" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="700" fill="#4285F4" text-anchor="middle">G</text><text x="640" y="400" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="17" font-weight="600" fill="#111827" text-anchor="middle">Confirmando tu identidad...</text><text x="640" y="428" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="middle">Volviendo desde Google. Esto toma un momento.</text><rect x="490" y="462" width="300" height="6" rx="3" fill="#E5E7EB"/><rect x="490" y="462" width="190" height="6" rx="3" fill="#0B6B57"/><text x="640" y="512" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#6B7280" text-anchor="middle">No cierres esta ventana</text><rect x="140" y="640" width="1000" height="56" rx="8" fill="#DCF2EC" stroke="#0B6B57" stroke-width="1"/><rect x="140" y="640" width="4" height="56" rx="0" fill="#0B6B57"/><text x="158" y="664" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#0B6B57" text-anchor="start">Pantalla tecnica, no interactiva</text><text x="158" y="682" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#374151" text-anchor="start">Recibe el token, abre la sesion y sale al panel. Si la cuenta ya existe como local, vuelve a UI-001 con el aviso correspondiente.</text><text x="1260" y="786" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#6B7280" text-anchor="end">MK-013 / UI-013  v1.0  FinMind  2026-08-17</text></svg>