ill="#9BA3AF" text-anchor="start">canvas</text><text x="1148" y="272" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#7C8493" text-anchor="start">#0B0E14  -</text><text x="48" y="350" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="17" font-weight="600" fill="#E6E8EC" text-anchor="start">Tipografia</text><text x="48" y="384" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="28" font-weight="700" fill="#E6E8EC" text-anchor="start">font.display  28/700  Titulo de portada</text><text x="48" y="426" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="700" fill="#E6E8EC" text-anchor="start">font.heading.lg  22/700  Titulo de pagina</text><text x="48" y="468" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="17" font-weight="600" fill="#E6E8EC" text-anchor="start">font.heading.md  17/600  Seccion</text><text x="48" y="510" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="400" fill="#E6E8EC" text-anchor="start">font.body.md  14/400  Texto general</text><text x="48" y="552" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#E6E8EC" text-anchor="start">font.label  12/600  Etiqueta de campo</text><text x="48" y="594" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#E6E8EC" text-anchor="start">font.caption  11/400  Ayuda secundaria</text><text x="560" y="350" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="17" font-weight="600" fill="#E6E8EC" text-anchor="start">Botones y estados</text><rect x="560" y="376" width="150" height="44" rx="8" fill="#14B8A6"/><text x="635.0" y="403.0" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="600" fill="#151A23" text-anchor="middle">Primario</text><rect x="724" y="376" width="150" height="44" rx="8" fill="#151A23" stroke="#252C38" stroke-width=