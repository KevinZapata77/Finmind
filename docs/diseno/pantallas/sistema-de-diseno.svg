width="220" height="40" rx="8" fill="#151A23" stroke="#14B8A6" stroke-width="2"/><rect x="815" y="561" width="226" height="46" rx="10" fill="none" stroke="#0F2E27" stroke-width="3"/><text x="830" y="589" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="400" fill="#E6E8EC" text-anchor="start">Texto</text><text x="560" y="646" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#9BA3AF" text-anchor="start">Con error</text><rect x="560" y="656" width="480" height="40" rx="8" fill="#151A23" stroke="#F87171" stroke-width="2"/><text x="572" y="681" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="400" fill="#E6E8EC" text-anchor="start">correo-invalido</text><text x="560" y="714" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="600" fill="#F87171" text-anchor="start">! Escribe un correo con formato valido, por ejemplo nombre@dominio.com</text><text x="48" y="646" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="17" font-weight="600" fill="#E6E8EC" text-anchor="start">Espaciado y radios</text><text x="48" y="676" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="400" fill="#9BA3AF" text-anchor="start">Unidad base 8 px. Escala 8 / 16 / 24 / 32 / 48.</text><text x="48" y="700" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="400" fill="#9BA3AF" text-anchor="start">Radios: sm 4, md 8, lg 12. Contenedor maximo 1280 px.</text><text x="48" y="724" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="400" fill="#9BA3AF" text-anchor="start">Breakpoints: movil &lt;768, tableta 768-1023, escritorio &gt;=1024.</text><text x="48" y="780" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="17" font-weight="600" fill="#E6E8EC" text-anchor="start">Estados semanticos: nunca solo color</text><rect x="48" y="800" width="130" height="30" rx="15" fill="#0F2E1B"/><text x="113" y="820" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#22C55E" text-anchor="middle">OK En rango</text><rect x="200" y="800" width="130" height="30" rx="15" fill="#2E2410"/><text x="265" y="820" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#FBBF24" text-anchor="middle">~ Alerta</text><rect x="340" y="800" width="130" height="30" rx="15" fill="#2E1414"/><text x="405" y="820" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#F87171" text-anchor="middle">! Excedido</text><text x="48" y="862" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="400" fill="#7C8493" text-anchor="start">Cada estado lleva icono y texto ademas del color, para cumplir UXA-03.</text><text x="1260" y="886" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#7C8493" text-anchor="end">Sistema de diseno  v1.0  FinMind  2026-09-08</text></svg>