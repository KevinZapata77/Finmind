" height="56" rx="0" fill="#0B6B57"/><text x="290" y="640" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#0B6B57" text-anchor="start">Las del sistema no se editan</text><text x="290" y="658" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#374151" text-anchor="start">Las ven todos los usuarios. Si uno pudiera renombrar 'Salario', se lo cambiaria a todos los demas. Desactivar una propia no borra sus movimientos.</text><text x="1260" y="786" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#6B7280" text-anchor="end">MK-015 / UI-015  v1.0  FinMind  2026-08-17</text></svg>