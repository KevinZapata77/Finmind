<svg viewBox="0 0 1280 800" width="1280" height="800" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d"><title id="t">UI-010 Verificar correo</title><desc id="d">Pantalla de verificacion con seis casillas para el codigo, cuatro ya diligenciadas, boton principal, contador para reenviar y aviso de que el codigo es de un solo uso.</desc><rect x="0" y="0" width="1280" height="800" rx="0" fill="#0B0E14"/><rect x="0" y="0" width="520" height="800" rx="0" fill="#12171F"/><rect x="64" y="72" width="34" height="34" rx="4" fill="#0D9488"/><text x="81" y="96" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="700" fill="#0B0E14" text-anchor="middle">F</text><text x="110" y="98" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="700" fill="#E6E8EC" text-anchor="start">FinMind</text><text x="64" y="340" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="34" font-weight="700" fill="#E6E8EC" text-anchor="start">Un paso mas.</text><text x="64" y="384" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="34" font-weight="700" fill="#E6E8EC" text-anchor="start"></text><text x="64" y="426" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="400" fill="#9BA3AF" text-anchor="start">Confirmamos tu correo para que solo tu</text><text x="64" y="450" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="400" fill="#9BA3AF" text-anchor="start">puedas entrar a tu cuenta.</text><rect x="640" y="150" width="520" height="500" rx="12" fill="#151A23" stroke="#1E2530" stroke-width="1"/><text x="680" y="206" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="700" fill="#E6E8EC" text-anchor="start">Verifica tu correo</text><text x="680" y="234" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="400" fill="#7C8493" text-anchor="start">Enviamos un codigo de 6 digitos a</text><text x="680" y="256" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="600" fill="#E6E8EC" text-anchor="start">kevin@ejemplo.com</text><text x="680" y="278" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#7C8493" text-anchor="start">Vence en 15 minutos.</text><text x="680" y="326" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#9BA3AF" text-anchor="start">Codigo de verificacion</text><rect x="680" y="340" width="62" height="64" rx="8" fill="#151A23" stroke="#14B8A6" stroke-width="2"/><text x="711.0" y="382" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="700" fill="#E6E8EC" text-anchor="middle">4</text><rect x="754" y="340" width="62" height="64" rx="8" fill="#151A23" stroke="#14B8A6" stroke-width="2"/><text x="785.0" y="382" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="700" fill="#E6E8EC" text-anchor="middle">8</text><rect x="828" y="340" width="62" height="64" rx="8" fill="#151A23" stroke="#14B8A6" stroke-width="2"/><text x="859.0" y="382" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="700" fill="#E6E8EC" text-anchor="middle">2</text><rect x="902" y="340" width="62" height="64" rx="8" fill="#151A23" stroke="#14B8A6" stroke-width="2"/><text x="933.0" y="382" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="700" fill="#E6E8EC" text-anchor="middle">9</text><rect x="976" y="340" width="62" height="64" rx="8" fill="#151A23" stroke="#252C38" stroke-width="1"/><rect x="1050" y="340" width="62" height="64" rx="8" fill="#151A23" stroke="#252C38" stroke-width="1"/><rect x="680" y="442" width="440" height="44" rx="8" fill="#14B8A6"/><text x="900.0" y="469.0" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="600" fill="#151A23" text-anchor="middle">Verificar y entrar</text><text x="680" y="522" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="400" fill="#7C8493" text-anchor="start">No te llego?</text><text x="782" y="522" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="400" fill="#7C8493" text-anchor="start">Puedes reenviarlo en 45s</text><rect x="680" y="546" width="440" height="56" rx="8" fill="#0F2E27" stroke="#14B8A6" stroke-width="1"/><rect x="680" y="546" width="4" height="56" rx="0" fill="#14B8A6"/><text x="698" y="570" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#14B8A6" text-anchor="start">El codigo es de un solo uso</text><text x="698" y="588" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#9BA3AF" text-anchor="start">Si pides otro, el anterior deja de servir.</text><text x="900" y="626" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="600" fill="#14B8A6" text-anchor="middle">Volver a iniciar sesion</text><text x="1260" y="786" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#7C8493" text-anchor="end">MK-010 / UI-010  v1.0  FinMind  2026-09-08</text></svg>