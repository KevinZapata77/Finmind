# Perfil de produccion / demostracion.
# Se activa con: SPRING_PROFILES_ACTIVE=prod
# Cumple CICD-02: configuracion de desarrollo, pruebas y produccion separada.

spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    # En produccion nunca se limpia la base. Blindaje explicito.
    clean-disabled: true

server:
  # Detras del proxy de Vercel, la peticion le llega a Spring con el host de
  # Render. Sin esto, al armar la direccion de retorno de Google escribiria
  # finmind-szny.onrender.com en vez del dominio publico, Google la rechazaria
  # por no estar autorizada, y la cookie de sesion quedaria puesta en el
  # dominio equivocado.
  #
  # Con 'framework', Spring lee X-Forwarded-Host y X-Forwarded-Proto —los que
  # pone Vercel— y arma las direcciones con el dominio que el navegador ve de
  # verdad. Solo se activa en produccion: en local no hay proxy delante y
  # confiar en esas cabeceras cuando cualquiera puede escribirlas seria un
  # agujero.
  forward-headers-strategy: framework

  error:
    # API-03: el manejo de errores no debe exponer trazas internas.
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false

finmind:
  cookie:
    # SEG-08. En produccion la cookie de sesion SOLO viaja por HTTPS.
    #
    # Esto no es un ajuste opcional: sin secure, la cookie se manda en texto
    # plano y cualquiera en la misma red —un wifi de cafeteria, la red de la
    # universidad— la copia y entra como el usuario. Con HttpOnly se protege de
    # los scripts de la pagina; con secure, de quien mira el cable.
    #
    # En el perfil de desarrollo va en false porque en local se trabaja sobre
    # http://localhost, y con secure en true el navegador simplemente no manda
    # la cookie: nadie podria iniciar sesion.
    #
    # OJO AL DESPLEGAR: si se activa este perfil sobre http en vez de https, el
    # inicio de sesion deja de funcionar. No es un defecto, es la proteccion
    # haciendo lo que tiene que hacer.
    segura: true

springdoc:
  # Dejar Swagger accesible para que el evaluador pruebe la API (DOC-04, API-08).
  # Si el despliegue fuera real y publico, aqui iria swagger-ui.enabled: false
  # y finmind.swagger.publico: false, que es lo que cierra la ruta (SEG-07).
  swagger-ui:
    enabled: true

logging:
  level:
    root: WARN
    com.finmind: INFO
    org.flywaydb: INFO
