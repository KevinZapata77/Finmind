spring:
  application:
    name: finmind
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/finmind}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Neon en plan gratuito escala a cero y tiene limite de conexiones.
      # Un pool grande la satura; 5 alcanza de sobra para este proyecto.
      maximum-pool-size: 5
      # PERF-02. Dos conexiones tibias en vez de una.
      #
      # Con minimum-idle en 1, la segunda peticion simultanea tenia que abrir
      # una conexion nueva, y abrir contra Neon no es gratis: handshake TLS mas
      # el enrutamiento hasta el compute. El panel dispara cinco peticiones a
      # la vez, asi que eso pasaba en cada carga.
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 900000
      # PERF-02. Latido cada dos minutos sobre las conexiones que estan quietas.
      #
      # Hace dos cosas. La primera: una conexion inactiva se muere sola por el
      # camino —cortafuegos, NAT, el propio Neon— y el pool no se entera hasta
      # que alguien la usa y falla; el latido la mantiene sana.
      #
      # La segunda es la que importaba para la demostracion. Neon en plan
      # gratuito suspende el compute a los ~5 minutos sin actividad, y
      # despertarlo tarda segundos: es lo que vio el profesor al abrir la
      # aplicacion despues de un rato quieta. Con el latido, MIENTRAS EL
      # BACKEND ESTE ARRIBA la base no se duerme nunca.
      #
      # El costo, dicho claro: eso consume horas de compute del plan gratuito
      # todo el tiempo que la aplicacion este corriendo. Es aceptable porque el
      # backend solo se levanta para trabajar o para mostrar el proyecto, no
      # 24/7. Si algun dia se despliega de verdad, esto hay que quitarlo.
      #
      # Tiene que ser menor que max-lifetime, o Hikari no arranca.
      keepalive-time: 120000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    default-property-inclusion: non_null
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000

server:
  port: 8080
  error:
    include-message: always
    include-stacktrace: never
    include-binding-errors: never

finmind:
  # Si no hay credenciales de correo configuradas, el codigo se escribe en el
  # log en lugar de enviarse. Permite demostrar el flujo sin depender del
  # servidor de correo (mitigacion del riesgo RSK-07).
  correo:
    remitente: ${MAIL_FROM:no-responder@finmind.local}
    habilitado: ${MAIL_ENABLED:false}
  # A donde vuelve el navegador tras autenticarse con Google, con el token
  oauth2:
    redireccion-exito: ${OAUTH2_SUCCESS_URL:http://localhost:5173/oauth2/callback}
    redireccion-error:  ${OAUTH2_ERROR_URL:http://localhost:5173/iniciar-sesion}
  captcha:
    # Con habilitado=false se omite la verificacion, para poder probar el
    # registro sin claves del proveedor. En la demostracion va en true.
    habilitado: ${CAPTCHA_ENABLED:false}
    secreto: ${CAPTCHA_SECRET:}
    # Turnstile de Cloudflare por defecto. Para reCAPTCHA de Google:
    # https://www.google.com/recaptcha/api/siteverify
    url-verificacion: ${CAPTCHA_VERIFY_URL:https://challenges.cloudflare.com/turnstile/v0/siteverify}
  codigo:
    vigencia-minutos: 15
    intentos-maximos: 5
    # SEG-04: el tope de 5 intentos por codigo no servia de nada mientras se
    # pudiera pedir un codigo nuevo sin freno. Limitando la EMISION quedan
    # 25 combinaciones por hora de un millon posibles.
    max-envios: ${CODIGO_MAX_ENVIOS:5}
    ventana-envios-minutos: ${CODIGO_VENTANA_ENVIOS:60}
    # SEG-05: dos envios seguidos tienen que estar separados. Sin esto, los
    # cinco de la hora se gastan en un segundo y se puede llenar de correos
    # la bandeja de cualquiera.
    intervalo-minimo-segundos: ${CODIGO_INTERVALO_MINIMO:60}
  # SEG-03: tope de intentos de inicio de sesion. Por correo frena probar mil
  # contrasenas contra una cuenta; por IP frena probar una contrasena contra
  # mil cuentas. Solo se cuentan los fallos y al entrar bien se borra la cuenta.
  login:
    max-por-correo: ${LOGIN_MAX_POR_CORREO:5}
    max-por-ip: ${LOGIN_MAX_POR_IP:20}
    ventana-minutos: ${LOGIN_VENTANA_MINUTOS:15}
  jwt:
    # SEG-01. Sin valor por defecto utilizable, a proposito.
    #
    # Aqui habia ${JWT_SECRET:clave_de_desarrollo_solo_local_minimo_32_caracteres}.
    # Ese texto esta publicado en GitHub, asi que cualquiera que leyera el
    # repositorio y encontrara una instancia levantada SIN la variable de
    # entorno podia firmar un token valido para cualquier correo, con el rol que
    # quisiera —incluido ADMIN— y entrar como esa persona. No hacia falta
    # adivinar ninguna contrasena: la llave con la que se firman las sesiones
    # estaba en el codigo fuente.
    #
    # Lo peligroso de un valor por defecto que funciona es justo que funciona:
    # la aplicacion arranca sin quejarse y nada avisa de que esta usando la
    # clave publica.
    #
    # Ahora queda vacio si no hay variable, y JwtService rechaza cualquier clave
    # de menos de 32 bytes al construirse: la aplicacion no arranca y dice por
    # que. Se prefiere el default vacio sobre no poner nada porque asi el error
    # que sale es el mensaje de JwtService, que explica que hacer, en vez del
    # "Could not resolve placeholder" de Spring.
    #
    # Las pruebas no se ven afectadas: application-test.yml trae su propia clave.
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        # Solo health. Ningun otro endpoint de actuator queda expuesto.
        include: health
  endpoint:
    health:
      show-details: never
  health:
    mail:
      # Al agregar el starter de correo, Actuator empezo a probar la conexion
      # SMTP dentro de /actuator/health. Sin credenciales esa prueba falla y el
      # health completo responde 503, o sea "la aplicacion esta caida".
      #
      # Y es falso: que el servidor de correo no responda no tumba a FinMind.
      # El envio degrada solo (el codigo queda en el log) y todo lo demas sigue.
      # Un health en 503 haria que el despliegue reinicie la aplicacion en vano.
      enabled: false

logging:
  level:
    com.finmind: DEBUG

# ---------------------------------------------------------------------------
# Acceso con Google (RF-029, RF-030)
#
# Va en un perfil aparte a proposito. Si se declara aqui con un valor por
# defecto vacio, Spring construye la registracion igual y aborta el arranque
# con "clientId cannot be empty": una cadena vacia no es lo mismo que una
# propiedad ausente. En un perfil, sin activar, la registracion no existe y
# SecurityConfig deja el acceso con Google apagado sin romper nada.
#
# Se activa con:  SPRING_PROFILES_ACTIVE=google
# ---------------------------------------------------------------------------
---
spring:
  config:
    activate:
      on-profile: google
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            # Solo pedimos identidad basica: nombre y correo. Nada mas.
            scope: openid, profile, email
