spring:
  application:
    name: finmind
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/finmind}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Neon en plan gratuito escala a cero y tiene limite de conexiones.
      # Un pool grande la satura; 5 alcanza de sobra para este proyecto.
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 900000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080
  error:
    include-message: always
    include-stacktrace: never
    include-binding-errors: never

finmind:
  jwt:
    secret: ${JWT_SECRET:clave_de_desarrollo_solo_local_minimo_32_caracteres}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        # Solo health. Ningun otro endpoint de actuator queda expuesto.
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.finmind: DEBUG
