spring:
  datasource:
    url: jdbc:h2:mem:finmind_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        # Obligatorio: application.yml fija el dialecto de PostgreSQL y en pruebas
        # la base es H2 en modo PostgreSQL. Sin esta linea el contexto no arranca.
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

finmind:
  # Fijado a mano, sin leer la variable de entorno.
  #
  # En application.yml esto es ${MAIL_ENABLED:false}, y en la maquina de
  # desarrollo el .env la pone en true. Sin esta linea, ejecutar las pruebas
  # ahi intentaria enviar correos de verdad a direcciones @finmind.test: lento,
  # ruidoso, y dependiente de que haya internet. Una prueba no debe cambiar de
  # comportamiento segun el entorno de quien la corre.
  correo:
    habilitado: false
    remitente: no-responder@finmind.test
  jwt:
    secret: clave_de_pruebas_unicamente_minimo_32_caracteres
    expiration-ms: 3600000
  cors:
    allowed-origins: http://localhost:5173

logging:
  level:
    org.springframework.security: WARN
