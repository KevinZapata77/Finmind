spring:
  datasource:
    url: jdbc:h2:mem:finmind_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        # Obligatorio: application.yml fija el dialecto de PostgreSQL y en pruebas
        # la base es H2 en modo PostgreSQL. Sin esta linea el contexto no arranca.
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

finmind:
  jwt:
    secret: clave_de_pruebas_unicamente_minimo_32_caracteres
    expiration-ms: 3600000
  cors:
    allowed-origins: http://localhost:5173

logging:
  level:
    org.springframework.security: WARN
