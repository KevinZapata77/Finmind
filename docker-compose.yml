# Entorno local completo: PostgreSQL + API, sin instalar nada mas que Docker.
#
# Uso:
#   docker compose up --build        levanta base de datos y API
#   docker compose down             detiene todo
#   docker compose down -v          detiene y BORRA los datos locales
#
# Esto es para desarrollo. La demostracion va contra la base en la nube.

services:

  postgres:
    image: postgres:16-alpine
    container_name: finmind-postgres
    environment:
      POSTGRES_DB: finmind
      POSTGRES_USER: finmind_user
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:-finmind_local}
      TZ: America/Bogota
    ports:
      - "5433:5432"   # 5433 en el host para no chocar con un PostgreSQL ya instalado
    volumes:
      - postgres_datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finmind_user -d finmind"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: finmind-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/finmind
      DB_USERNAME: finmind_user
      DB_PASSWORD: ${LOCAL_DB_PASSWORD:-finmind_local}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: 3600000
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "8080:8080"

volumes:
  postgres_datos:
